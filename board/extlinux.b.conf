# Nerves boot configuration - slot B (written by fwup)
#
# Do not add "menu title", "prompt" or "timeout" lines: they make U-Boot wait
# for console input. The tablet's power button sends an empty Enter, which
# leaves the menu stuck at "Enter choice:".
#
# U-Boot sets $fdtfile from the board revision (grouper-E1565, grouper-PM269
# or tilapia-E1565), so fdtdir picks the right device tree.
default nerves
label nerves
	kernel /b/zImage
	fdtdir /b/
	append root=/dev/mmcblk0p3 rootfstype=squashfs ro rootwait console=tty0 quiet g_ether.dev_addr=02:4e:37:00:00:02 g_ether.host_addr=02:4e:37:00:00:01
