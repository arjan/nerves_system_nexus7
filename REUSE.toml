version = 1

[[annotations]]
path = [
 ".formatter.exs",
 ".gitignore",
 "CHANGELOG.md",
 "nerves_defconfig",
 "REUSE.toml",
 "mix.exs",
 "mix.lock",
 "VERSION"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
 "README.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2016 Frank Hunleth", "2026 Arjan Scherpenisse"]
SPDX-License-Identifier = "CC-BY-4.0"

# Buildroot derived or related files
[[annotations]]
path = [
 "Config.in",
 "post-build.sh",
 "post-createfs.sh"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Buildroot developers <buildroot@buildroot.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Linux kernel derived or related files
[[annotations]]
path = [
 "linux/*"
]
precedence = "override"
SPDX-FileCopyrightText = "Various"
SPDX-License-Identifier = "GPL-2.0-only"

# Fwup and boot config files
[[annotations]]
path = [
 "board/*",
 "fwup-ops.conf",
 "fwup.conf",
 "fwup_include/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# Various config files
[[annotations]]
path = [
 "busybox.fragment",
 "rootfs_overlay/etc/boardid.config",
 "rootfs_overlay/etc/erlinit.config",
 "rootfs_overlay/etc/fw_env.config",
 "rootfs_overlay/mnt/boot/.empty"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# Firmware from https://codeberg.org/libre-tegra/firmware
# (commit 00988ea994efa39550cc19f3b225874a32f1c3e0); see its WHENCE file.
[[annotations]]
path = [
 "rootfs_overlay/lib/firmware/brcm/brcmfmac4330-sdio.bin",
 "rootfs_overlay/lib/firmware/LICENCE.broadcom_bcm43xx"
]
precedence = "override"
SPDX-FileCopyrightText = "Broadcom Corporation"
SPDX-License-Identifier = "LicenseRef-Broadcom-BCM43xx"

[[annotations]]
path = [
 "rootfs_overlay/lib/firmware/brcm/BCM4330B1.asus,grouper.hcd",
 "rootfs_overlay/lib/firmware/LICENCE.APACHE-2.0"
]
precedence = "override"
SPDX-FileCopyrightText = "Broadcom Corporation; provenance in WHENCE of https://codeberg.org/libre-tegra/firmware"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
 "rootfs_overlay/lib/firmware/brcm/brcmfmac4330-sdio.asus,grouper.txt"
]
precedence = "override"
SPDX-FileCopyrightText = "Various; provenance in WHENCE of https://codeberg.org/libre-tegra/firmware"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
 "assets/nexus7.jpeg"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Arjan Scherpenisse"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
 "scripts/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Arjan Scherpenisse"
SPDX-License-Identifier = "CC0-1.0"
