# Disable the in-firmware WPA supplicant (BRCMF_FEAT_FWSUP, bit 13).
# With the BCM4330 firmware 5.90.195.114, the firmware completes the 4-way
# handshake but the "connected" event never reaches the host, so
# wpa_supplicant times out and disconnects every 10 seconds.
options brcmfmac feature_disable=0x2000
